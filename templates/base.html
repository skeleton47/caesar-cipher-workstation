<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CIPHER_OS // ACCESS_TERMINAL{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Grunge CRT Grain & Coordinate Crosshairs Overlay -->
    <div class="grunge-grain-overlay"></div>
    <div class="crt-scanlines"></div>

    <!-- Cyber Transition Overlay -->
    <div class="cyber-transition-curtain" id="cyber-curtain">
        <div class="curtain-line"></div>
        <div class="curtain-glitch-text">AUTHENTICATING CIPHER SUBSYSTEM...</div>
    </div>

    <div class="terminal-container">
        <!-- TOP TELEMETRY HUD -->
        <header class="tactical-hud-header">
            <div class="hud-left-meta">
                <div class="source-block">
                    <span class="source-label">SOURCE: CIPHER_SYS</span>
                    <div class="grid-brackets">
                        <span>┌ ┐ ┌ ┐</span>
                        <span>└ ┘ └ ┘</span>
                    </div>
                </div>
                <div class="uplink-block">
                    <span class="uplink-status">[UPLINK ESTABLISHED]</span>
                    <span class="uplink-sub">[ROT-26 SUBSYSTEM]</span>
                </div>
            </div>

            <!-- Mini Nav Bar + Sound Toggle -->
            <nav class="hud-nav-bar">
                <a href="/" class="nav-item {{ 'active' if active_page == 'home' }}">[TERMINAL]</a>
                <a href="/about" class="nav-item {{ 'active' if active_page == 'about' }}">[INTEL_SPEC]</a>
                <button class="sfx-toggle-btn" id="sfx-toggle" title="Toggle Sound">[SFX: ON]</button>
            </nav>
        </header>

        <!-- MAIN VIEWPORT -->
        <main class="tactical-main">
            {% block content %}{% endblock %}
        </main>

        <!-- FOOTER STATUS -->
        <footer class="tactical-footer">
            <div class="footer-prompt">
                <span class="prompt-sym">&gt;&gt;&gt;</span>
                <span class="prompt-text">_SYSTEM_READY...</span>
            </div>
            <div class="footer-glyphs">
                <span class="crosshair-marker">+</span>
                <span class="diamond-group">&loz; &loz; &loz;</span>
            </div>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/sfx.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
