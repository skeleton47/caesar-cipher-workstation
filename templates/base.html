<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CIPHER LAB — DevTools Cryptography Workbench{% endblock %}</title>
    
    <!-- Modern Typography: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- SHADCN APP HEADER (NAVBAR) -->
    <header class="site-header">
        <div class="header-inner">
            <div class="header-left">
                <!-- Brand Link -->
                <a href="/" class="brand-link" aria-label="CIPHER LAB">
                    <div class="brand-icon-box">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </div>
                    <span class="brand-title">
                        CIPHER LAB
                        <span class="badge badge-secondary" style="font-size: 0.68rem; padding: 1px 6px;">v2.0</span>
                    </span>
                </a>

                <!-- Header Navigation Links -->
                <nav class="header-nav" aria-label="Primary Navigation">
                    <button type="button" class="nav-link-btn active" data-nav-mode="encrypt">Encrypt</button>
                    <button type="button" class="nav-link-btn" data-nav-mode="decrypt">Decrypt</button>
                    <button type="button" class="nav-link-btn" data-nav-mode="crack">Crack</button>
                    <a href="/#learn" class="nav-link-btn">Learn</a>
                    <a href="/about" class="nav-link-btn {{ 'active' if active_page == 'about' else '' }}">Specifications</a>
                </nav>
            </div>

            <!-- Header Right Controls -->
            <div class="header-right">
                <div class="engine-status-badge" title="All cryptographic calculations run locally in memory. Zero network payloads stored.">
                    <span class="status-dot"></span>
                    <span>Local Client Engine</span>
                </div>

                <button type="button" class="btn btn-outline btn-sm" id="sfx-toggle" title="Toggle tactile audio feedback" aria-label="Toggle Sound Effects">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
                    </svg>
                    <span id="sfx-label">SFX: ON</span>
                </button>

                <a href="https://github.com/skeleton47/caesar-cipher-workstation" target="_blank" rel="noopener noreferrer" class="btn btn-outline btn-sm btn-icon" title="View Source on GitHub">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
                        <path d="M9 18c-4.51 2-5-2-7-2"/>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN VIEWPORT -->
    <main class="workbench-container">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-left">
                <strong>CIPHER LAB</strong>
                <span>— Developer Tools & Cryptographic Substitution Workbench</span>
            </div>
            <div class="footer-links">
                <a href="/#learn" class="footer-link">Caesar Foundations</a>
                <span>·</span>
                <a href="/about" class="footer-link">Formal Specs</a>
                <span>·</span>
                <a href="https://github.com/skeleton47/caesar-cipher-workstation" target="_blank" rel="noopener noreferrer" class="footer-link">GitHub Repository</a>
            </div>
        </div>
    </footer>

    <!-- Audio Synthesizer Engine -->
    <script src="{{ url_for('static', filename='js/sfx.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
