<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CIPHER LAB — Interactive Cryptography Playground{% endblock %}</title>
    
    <!-- Modern Typography: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Ambient Backdrop Atmosphere -->
    <div class="ambient-glow"></div>
    <div class="subtle-grid"></div>

    <!-- SITE NAVIGATION HEADER -->
    <header class="site-header">
        <div class="header-container">
            <!-- Brand Wordmark & Monogram Symbol -->
            <a href="/" class="brand-link" aria-label="CIPHER LAB Home">
                <div class="brand-symbol">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="12" r="6" />
                        <circle cx="15" cy="12" r="6" />
                    </svg>
                </div>
                <span class="brand-name">
                    CIPHER LAB
                    <span class="badge-beta">v2.0</span>
                </span>
            </a>

            <!-- Navigation Links -->
            <nav class="header-nav" aria-label="Primary Navigation">
                <button type="button" class="nav-pill active" data-nav-mode="encrypt">Encrypt</button>
                <button type="button" class="nav-pill" data-nav-mode="decrypt">Decrypt</button>
                <button type="button" class="nav-pill" data-nav-mode="crack">Crack</button>
                <a href="#learn" class="nav-pill">Learn</a>
            </nav>

            <!-- Actions / Privacy & Audio Controls -->
            <div class="header-actions">
                <div class="local-engine-tag" title="All encryption occurs locally in your browser. No payloads are stored.">
                    <span class="status-indicator-dot"></span>
                    <span>Client-Side Engine</span>
                </div>

                <button type="button" class="sfx-toggle-btn" id="sfx-toggle" title="Toggle tactile audio feedback" aria-label="Toggle Sound Effects">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
                    </svg>
                    <span id="sfx-label">SFX: ON</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN VIEWPORT -->
    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-left">
                <span class="footer-brand">CIPHER LAB</span>
                <span>— Interactive Cryptography & Substitution Instrument</span>
            </div>
            <div class="footer-right">
                <a href="#learn" class="footer-link">How Caesar Works</a>
                <span class="footer-sep">·</span>
                <a href="https://github.com/skeleton47/caesar-cipher-workstation" target="_blank" rel="noopener noreferrer" class="footer-link">GitHub Repository</a>
            </div>
        </div>
    </footer>

    <!-- Audio Synthesizer Engine -->
    <script src="{{ url_for('static', filename='js/sfx.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
