<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CIPHER_OS // CAESAR WORKSTATION{% endblock %}</title>
    
    <!-- Precision Cryptographic & Technical Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Tactical Grid & Scanline Atmosphere -->
    <div class="tactical-grid-bg"></div>
    <div class="crt-scanlines"></div>

    <!-- Cyber Transition Curtain -->
    <div class="cyber-transition-curtain" id="cyber-curtain">
        <div class="curtain-scanner-line"></div>
        <div class="curtain-meta-box">
            <span class="curtain-status-icon">❖</span>
            <span class="curtain-glitch-text">INITIALIZING CRYPTOGRAPHIC KERNEL...</span>
            <span class="curtain-sub-metric">[ROT-26 / OK]</span>
        </div>
    </div>

    <div class="terminal-container">
        <!-- TOP TELEMETRY HUD HEADER -->
        <header class="tactical-hud-header">
            <div class="hud-left-meta">
                <div class="source-block">
                    <span class="source-label">SOURCE: CIPHER_SYS</span>
                    <div class="grid-brackets">
                        <span>┌ ┐ ┌ ┐</span>
                        <span>└ ┘ └ ┘</span>
                    </div>
                </div>
                
                <div class="uplink-block">
                    <div class="uplink-status-row">
                        <span class="uplink-status">[UPLINK: ACTIVE]</span>
                        <span class="uplink-sub">[ROT-26 SUBSYSTEM]</span>
                    </div>
                    <span class="clock-readout" id="live-utc-clock">UTC 00:00:00.000</span>
                </div>
            </div>

            <!-- Mini Nav Bar + Sound Toggle -->
            <nav class="hud-nav-bar">
                <a href="/" class="nav-item {{ 'active' if active_page == 'home' }}">[WORKSTATION]</a>
                <a href="/about" class="nav-item {{ 'active' if active_page == 'about' }}">[INTEL_SPEC]</a>
                <button class="sfx-toggle-btn" id="sfx-toggle" title="Toggle Sound">
                    <span class="sfx-state-dot"></span> [SFX: ON]
                </button>
            </nav>
        </header>

        <!-- MAIN VIEWPORT -->
        <main class="tactical-main">
            {% block content %}{% endblock %}
        </main>

        <!-- FOOTER STATUS -->
        <footer class="tactical-footer">
            <div class="footer-prompt">
                <span class="prompt-sym">&gt;&gt;&gt;</span>
                <span class="prompt-text">_SYSTEM_READY // AWAITING_CARRIER</span>
            </div>
            <div class="footer-glyphs">
                <span class="crosshair-marker">+</span>
                <span class="diamond-group">&loz; &loz; &loz;</span>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/sfx.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
